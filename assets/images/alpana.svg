<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" aria-hidden="true">
  <defs>
    <g id="alpana-outer-petal">
      <path d="M300 92 C266 140 258 184 300 226 C342 184 334 140 300 92 Z"
            fill="#fff8dc" fill-opacity="0.5" stroke="#8b1e2d" stroke-width="3"/>
      <path d="M300 116 C282 150 280 180 300 208 C320 180 318 150 300 116 Z"
            fill="none" stroke="#c8910a" stroke-width="2"/>
      <circle cx="300" cy="78" r="5" fill="#c8910a"/>
    </g>
    <g id="alpana-inner-petal">
      <path d="M300 198 C276 230 274 260 300 288 C326 260 324 230 300 198 Z"
            fill="#8b1e2d" fill-opacity="0.12" stroke="#c8910a" stroke-width="2.5"/>
      <path d="M300 216 C288 238 288 258 300 276 C312 258 312 238 300 216 Z"
            fill="none" stroke="#8b1e2d" stroke-width="1.4" stroke-opacity="0.6"/>
    </g>
  </defs>

  <!-- outer rice-paste rings -->
  <circle cx="300" cy="300" r="278" fill="none" stroke="#c8910a" stroke-width="3"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#8b1e2d" stroke-width="1.6"
          stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="232" fill="none" stroke="#c8910a" stroke-width="2"/>

  <!-- twelve-petal lotus -->
  <g>
    <use href="#alpana-outer-petal" transform="rotate(0 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(30 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(60 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(90 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(120 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(150 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(180 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(210 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(240 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(270 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(300 300 300)"/>
    <use href="#alpana-outer-petal" transform="rotate(330 300 300)"/>
  </g>

  <!-- inner mandala -->
  <circle cx="300" cy="300" r="154" fill="#fff8dc" fill-opacity="0.35"
          stroke="#8b1e2d" stroke-width="2"/>
  <circle cx="300" cy="300" r="136" fill="none" stroke="#c8910a" stroke-width="1.6"
          stroke-dasharray="1 10" stroke-linecap="round"/>
  <g>
    <use href="#alpana-inner-petal" transform="rotate(0 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(45 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(90 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(135 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(180 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(225 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(270 300 300)"/>
    <use href="#alpana-inner-petal" transform="rotate(315 300 300)"/>
  </g>

  <!-- central lotus -->
  <circle cx="300" cy="300" r="48" fill="#fffdf2" stroke="#c8910a" stroke-width="3"/>
  <circle cx="300" cy="300" r="30" fill="#8b1e2d" fill-opacity="0.85"/>
  <path d="M300 280 C287 292 287 308 300 320 C313 308 313 292 300 280 Z" fill="#fff8dc"/>
  <path d="M280 300 C292 287 308 287 320 300 C308 313 292 313 280 300 Z" fill="#fff8dc" fill-opacity="0.75"/>
  <circle cx="300" cy="300" r="5" fill="#c8910a"/>

  <!-- auspicious corner dots -->
  <g fill="#c8910a">
    <circle cx="300" cy="14" r="3"/><circle cx="300" cy="586" r="3"/>
    <circle cx="14" cy="300" r="3"/><circle cx="586" cy="300" r="3"/>
  </g>
</svg>
